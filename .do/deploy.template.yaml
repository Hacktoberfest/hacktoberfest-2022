spec:
  name: hacktoberfest-nyc
  region: nyc

  alerts:
    - rule: DEPLOYMENT_LIVE
    - rule: DEPLOYMENT_FAILED

  features:
    - enable-kata-build

  jobs:
    - environment_slug: node-js
      envs:
        - key: CLOUDFLARE_ZONE_ID
          scope: RUN_TIME
        - key: CLOUDFLARE_API_TOKEN
          scope: RUN_TIME
          type: SECRET
      github:
        branch: main
        deploy_on_push: true
        repo: MLH/hacktoberfest-2026-frontend
      instance_count: 1
      instance_size_slug: basic-xxs
      kind: POST_DEPLOY
      name: hacktoberfest-production-nyc-job
      run_command: npm run postbuild
      source_dir: /

  static_sites:
    - build_command: npm run build
      environment_slug: node-js
      envs:
        - key: BASE_URL
          scope: BUILD_TIME
        # Unset = the mocked build: /my serves fixtures and sign-in fakes a
        # session as Ada Lovelace. Production must set this to the API's
        # public origin (see the API repo's README for the full wiring,
        # including routing hacktoberfest.com/oauth/* to the API).
        - key: NEXT_PUBLIC_API_BASE_URL
          scope: BUILD_TIME
        - key: BUILD_ID
          scope: BUILD_TIME
          value: ${_self.COMMIT_HASH}
      github:
        branch: main
        deploy_on_push: true
        repo: MLH/hacktoberfest-2026-frontend
      name: hacktoberfest-production-nyc
      output_dir: out
      routes:
        - path: /
      source_dir: /

  ingress:
    rules:
      - component:
          name: hacktoberfest-production-nyc
        match:
          path:
            prefix: /
      - match:
          path:
            prefix: /security.txt
        redirect:
          authority: hacktoberfest.com
          redirect_code: 301
          uri: /.well-known/security.txt
