spec:
  name: hacktoberfest-nyc
  region: nyc

  alerts:
    - rule: DEPLOYMENT_LIVE
    - rule: DEPLOYMENT_FAILED

  features:
    - enable-kata-build

  jobs:
    - environment_slug: node-js
      envs:
        - key: CLOUDFLARE_ZONE_ID
          scope: RUN_TIME
        - key: CLOUDFLARE_API_TOKEN
          scope: RUN_TIME
          type: SECRET
      github:
        branch: production
        deploy_on_push: true
        repo: Hacktoberfest/hacktoberfest-2022
      instance_count: 1
      instance_size_slug: basic-xxs
      kind: POST_DEPLOY
      name: hacktoberfest-production-nyc-job
      run_command: npm run postbuild
      source_dir: /

  static_sites:
    - build_command: npm run build
      environment_slug: node-js
      envs:
        - key: BASE_URL
          scope: BUILD_TIME
        - key: BUILD_ID
          scope: BUILD_TIME
          value: ${_self.COMMIT_HASH}
      github:
        branch: production
        deploy_on_push: true
        repo: Hacktoberfest/hacktoberfest-2022
      name: hacktoberfest-production-nyc
      output_dir: out
      routes:
        - path: /
      source_dir: /

  ingress:
    rules:
      - component:
          name: hacktoberfest-production-nyc
        match:
          path:
            prefix: /
      - match:
          path:
            prefix: /security.txt
        redirect:
          authority: hacktoberfest.com
          redirect_code: 301
          uri: /.well-known/security.txt
      - match:
          path:
            prefix: /organizers
        redirect:
          authority: hacktoberfest.com
          redirect_code: 302
          uri: /events/#organizers
      - match:
          path:
            prefix: /brand
        redirect:
          authority: hacktoberfest.com
          redirect_code: 302
          uri: /events/#brand
      - match:
          path:
            prefix: /lore
        redirect:
          authority: hacktoberfest.com
          redirect_code: 302
          uri: /about/#lore
      - match:
          path:
            prefix: /love
        redirect:
          authority: hacktoberfest.com
          redirect_code: 302
          uri: /about/#love
      - match:
          path:
            prefix: /sponsors
        redirect:
          authority: hacktoberfest.com
          redirect_code: 302
          uri: /about/#sponsors
      - match:
          path:
            prefix: /rewards
        redirect:
          authority: hacktoberfest.com
          redirect_code: 302
          uri: /about/#rewards
